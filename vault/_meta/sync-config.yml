repo:
  owner: amirmirmehrkar-git
  name: notion-obsidian-sync
  branch: main

notion:
  # A future sync consumer must validate this mode and fail closed.
  scope: explicit_pages
  page_ids: []

sync:
  enabled: false
  mode:
    first_run: full
    next_runs: diffs
  approval: every_change
  conflict_policy: ask_user

mapping:
  tags:
    notion_property_name: "Tags"
    obsidian_frontmatter_key: "tags"
